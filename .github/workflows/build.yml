name: Build STOPlien
on: [workflow_dispatch]
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: |
          SDK="/usr/local/lib/android/sdk"
          BT=$(ls "$SDK/build-tools" | sort -V | tail -n 1)
          PL=$(ls "$SDK/platforms" | sort -V | tail -n 1)
          mkdir -p build/obj build/dex build/res/drawable
          python3 -c '
          from PIL import Image, ImageDraw
          img = Image.new("RGBA", (192, 192), (18, 18, 22, 255))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle([16, 16, 176, 176], radius=36, fill=(220, 20, 20, 255), outline=(255, 255, 255, 255), width=8)
          d.text((54, 84), "STOP", fill=(255, 255, 255, 255))
          img.save("build/res/drawable/icon.png")
          '
          "$SDK/build-tools/$BT/aapt2" compile --dir build/res -o build/res.zip
          python3 -c 'import base64; open("build/AndroidManifest.xml","wb").write(base64.b64decode(""))'
          "$SDK/build-tools/$BT/aapt2" link -o build/unaligned.apk -I "$SDK/platforms/$PL/android.jar" --manifest build/AndroidManifest.xml build/res.zip
          javac --release 8 -cp "$SDK/platforms/$PL/android.jar" -d build/obj android/MainActivity.java
          "$SDK/build-tools/$BT/d8" --lib "$SDK/platforms/$PL/android.jar" --output build/dex build/obj/com/stoplien/browser/*.class
          python3 -c 'import zipfile; z=zipfile.ZipFile("build/unaligned.apk","a"); z.write("build/dex/classes.dex","classes.dex"); z.close()'
          "$SDK/build-tools/$BT/zipalign" -f 4 build/unaligned.apk build/aligned.apk
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=STOP,O=STOP,C=RU"
          "$SDK/build-tools/$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android --out STOPlien-Browser.apk build/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: STOPlien-Browser-Android
          path: STOPlien-Browser.apk
