name: Build STOPlien Browser
on: [workflow_dispatch, push]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyQt5 PyQtWebEngine pyinstaller
      - run: pyinstaller --onefile --windowed --name STOPlien-Browser stoplien-browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: STOPlien-Browser-Windows
          path: dist/STOPlien-Browser.exe
